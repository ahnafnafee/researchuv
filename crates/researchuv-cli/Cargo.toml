[package]
name = "researchuv-cli"
description = "Command-line entry point for ResearchUV: mesh inspection and the full unwrap pipeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "researchuv"
path = "src/main.rs"

[dependencies]
researchuv-core = { path = "../researchuv-core" }
researchuv-unwrap = { path = "../researchuv-unwrap" }
researchuv-api = { path = "../researchuv-api" }
researchuv-math = { path = "../researchuv-math" }

[dev-dependencies]
researchuv-core = { path = "../researchuv-core" }
researchuv-unwrap = { path = "../researchuv-unwrap" }
